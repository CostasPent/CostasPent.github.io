<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="Konstantinos Pentarakis">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
  <header class="bar">
    <a class="brand mono" href="{{ '/' | relative_url }}">kostas@sec:~$</a>
    <nav class="mono" aria-label="Main">
      <a href="{{ '/writeups/' | relative_url }}"{% if page.url contains '/writeups' %} class="on"{% endif %}>/writeups</a>
      {% if site.data.projects.size > 0 %}<a href="{{ '/projects/' | relative_url }}"{% if page.url contains '/projects' %} class="on"{% endif %}>/projects</a>{% endif %}
      <a href="{{ '/experience/' | relative_url }}"{% if page.url contains '/experience' %} class="on"{% endif %}>/experience</a>
      <a href="{{ '/education/' | relative_url }}"{% if page.url contains '/education' %} class="on"{% endif %}>/education</a>
    </nav>
    <button id="theme" class="mono" type="button" aria-label="Toggle light and dark theme">[light]</button>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="wrap mono">
    <p>&copy; {{ 'now' | date: '%Y' }} Kostas Pentarakis. Everything here comes from legal practice environments: training labs, retired machines and finished CTFs. No real targets, no flags.</p>
  </footer>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
